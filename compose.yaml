# Local development services. Start them with: docker compose up -d
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookshop
      POSTGRES_PASSWORD: bookshop # fine for a local dev database, never for a real server
      POSTGRES_DB: bookshop
    ports:
      - "127.0.0.1:15432:5432" # reachable only from this computer, not from your Wi-Fi network
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ keeps its data here; the volume survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshop -d bookshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A pretend mail server. It accepts every email the app sends and keeps it in an inbox you
  # read in the browser at http://localhost:8025. Nothing ever reaches a real mailbox.
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # the inbox web page
      - "127.0.0.1:1025:1025" # SMTP: the app hands its emails over here

volumes:
  pgdata:
